# application.properties

spring.application.name=k5_iot_springboot

server.port=8080

# secret profile active ???
spring.profiles.active=secret

spring.datasource.url=jdbc:mysql://localhost:3306/k5_iot_springboot
spring.datasource.username=root

spring.jpa.show-sql=true
#spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.ddl-auto=validate

#logging.file.name=logs/app.log
logging.level.root=INFO

#spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== jwt =====
jwt.secret=1234567890qwertyuiopasdfghjklzxcvbnmQWERTYUIOPASDFGHJKLZXCVBNM1234567890

# 1000 ms = 1s
# 60s = 1m
# 60m = 1h = 3600000ms
# 10h = 36000000ms
# 10m = 600000ms
jwt.expiration=600000
# 1Day = 86400000 (7day = 604800000)
jwt.refresh-expiration=604800000
# 3s = 180000ms
jwt.email-expiration=180000
jwt.clock-skew-seconds=36000

# ===== CORS ======
cors.allowed-origins=*

cors.allowed-headers=*

cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS

cors.exposed-headers=Authorization,Set-cookie


# ===== Dev Option =====
security.h2-console=true

# ===== Spring Web Email ===== #
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=bomingim022@gmail.com
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000